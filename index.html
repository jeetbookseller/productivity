<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Productivity Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore Supabase auth hash forwarded by 404.html (GitHub Pages SPA redirect).
      (function () {
        var h = sessionStorage.getItem('spa_redirect_hash');
        if (h) {
          sessionStorage.removeItem('spa_redirect_hash');
          if (h && !window.location.hash) {
            history.replaceState(null, '', window.location.pathname + h);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
